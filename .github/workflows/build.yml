name: Build Lua2OMP

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        arch: [Win32, x64]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - name: Configure
        run: cmake -S . -B build -A ${{ matrix.arch }} -DCMAKE_BUILD_TYPE=Release
      - name: Build
        run: cmake --build build --config Release --parallel
      - name: Package
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          Copy-Item build/Release/Lua2OMP.dll dist/
          Copy-Item build/Release/luac.exe dist/
          Copy-Item build/Release/luaenc.exe dist/
          Copy-Item README.md dist/
          Compress-Archive -Path dist/* -DestinationPath Lua2OMP-windows-${{ matrix.arch }}.zip
      - uses: actions/upload-artifact@v4
        with:
          name: Lua2OMP-windows-${{ matrix.arch }}
          path: Lua2OMP-windows-${{ matrix.arch }}.zip
